<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>中秋快乐 · 但愿人长久</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23f6d47c'/><circle cx='38' cy='42' r='7' fill='%23e0b45a' opacity='.55'/><circle cx='60' cy='60' r='5' fill='%23e0b45a' opacity='.55'/></svg>">
<link rel="preconnect" href="https://fonts.loli.net">
<link rel="preconnect" href="https://fonts-gstatic.loli.net" crossorigin>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Zhi+Mang+Xing&text=%E4%B8%AD%E7%A7%8B%E5%BF%AB%E4%B9%90&display=swap">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&text=%E4%B8%AD%E7%A7%8B%E5%BF%AB%E4%B9%90&display=swap">
<style>
  @property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
  :root{
    --gold:#e8c983;
    --gold-deep:#b98d4a;
    --ink:#3d2b1f;
    --paper:#fff8ea;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","KaiTi","楷体",serif;
    background:linear-gradient(180deg,#04091a 0%,#0a1633 38%,#12234f 72%,#1c3163 100%);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    animation:fadeIn 1.1s ease both;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%,transparent 55%,rgba(2,6,18,.55) 100%);
  }
  img{max-width:100%;-webkit-user-drag:none}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ---------- 星空画布 / 夜空 ---------- */
  #stars{position:fixed;inset:0;z-index:0;animation:fadeIn 1.4s ease both}
  #sky{position:fixed;inset:0;overflow:hidden;z-index:1}

  .moon-glow{
    position:absolute;top:7vh;right:9vw;
    width:clamp(110px,20vmin,190px);aspect-ratio:1;border-radius:50%;
    transform:scale(1.6);pointer-events:none;
    background:radial-gradient(circle,rgba(255,224,140,.4) 0%,rgba(255,210,120,.13) 46%,transparent 70%);
    animation:breath 5.6s ease-in-out 1s infinite alternate,moonrise 2s ease-out .3s both;
  }
  .fest .moon-glow{
    background:radial-gradient(circle,rgba(255,230,150,.62) 0%,rgba(255,216,130,.22) 48%,transparent 72%);
    animation-duration:3.8s;
  }
  @keyframes breath{from{opacity:.5;transform:scale(1.5)}to{opacity:1;transform:scale(1.72)}}
  .moon{
    position:absolute;top:7vh;right:9vw;
    width:clamp(110px,20vmin,190px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 34% 32%,#fffbe8 0%,#ffedae 42%,#ffd977 74%,#f5c04a 100%);
    box-shadow:0 0 40px 12px rgba(255,224,140,.5),inset -8px -10px 28px rgba(214,150,40,.35);
    animation:moonrise 2.2s ease-out .45s both;
  }
  .fest .moon{box-shadow:0 0 64px 22px rgba(255,228,150,.7),inset -8px -10px 28px rgba(214,150,40,.35)}
  .moon i{position:absolute;border-radius:50%;background:rgba(216,164,66,.26);box-shadow:inset 1px 2px 3px rgba(150,100,20,.35);filter:blur(.5px)}
  .moon i:nth-child(2){width:22%;height:22%;left:26%;top:52%}
  .moon i:nth-child(3){width:14%;height:14%;left:58%;top:30%}
  .moon i:nth-child(4){width:10%;height:10%;left:48%;top:66%}
  .moon i:nth-child(5){width:8%;height:8%;left:70%;top:58%}
  @keyframes moonrise{from{opacity:0;transform:translateY(9vh) scale(.92)}to{opacity:1;transform:none}}

  .cloud{
    position:absolute;height:26px;border-radius:50px;
    background:rgba(190,205,235,.10);filter:blur(6px);
    animation:drift linear infinite;
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%;filter:blur(6px)}
  .cloud::before{width:55%;height:180%;left:18%;top:-80%}
  .cloud::after{width:40%;height:140%;right:14%;top:-50%}
  @keyframes drift{from{transform:translateX(-40vw)}to{transform:translateX(140vw)}}

  /* ---------- 山丘、桂树与玉兔 ---------- */
  .hill{
    position:fixed;left:-12vw;bottom:-16vh;width:70vw;height:34vh;
    border-radius:50%;background:#0b1830;
    box-shadow:inset 0 14px 30px rgba(70,100,160,.25);
    animation:moonrise 1.8s ease-out .5s both;
  }
  .hill.h2{left:auto;right:-20vw;bottom:-20vh;width:90vw;height:38vh;background:#081226}
  .hill.h3{left:-6vw;bottom:-24vh;width:120vw;height:42vh;background:#0d1e3e;z-index:-1}
  .mist{
    position:fixed;left:0;right:0;bottom:24vh;height:12vh;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(140,170,220,.07) 55%,transparent);
    filter:blur(10px);
  }
  .tree{
    position:fixed;left:4vw;bottom:11vh;width:clamp(90px,14vmin,150px);
    opacity:.95;animation:moonrise 2.4s ease-out .7s both;
  }
  .rabbit{
    position:fixed;left:15vw;bottom:calc(12vh - 2px);width:clamp(58px,10vmin,96px);
    opacity:.95;animation:moonrise 2.4s ease-out .9s both;
  }
  .grass{position:fixed;left:7vw;bottom:11.2vh;width:28vw;height:3vh;opacity:.55}

  /* ---------- 灯笼 ---------- */
  .lantern{
    position:absolute;top:0;pointer-events:none;z-index:2;
    animation:floatup var(--t,22s) linear var(--delay,0s) forwards;
  }
  .lantern .body{
    position:relative;width:var(--s,44px);height:calc(var(--s,44px)*1.24);
    border-radius:46% 46% 50% 50%;
    background:linear-gradient(160deg,#f9974f 0%,#e6502e 45%,#c02222 100%);
    box-shadow:
      0 0 22px 7px rgba(255,110,50,.4),
      inset 0 -6px 12px rgba(120,10,10,.55),
      inset 0 6px 10px rgba(255,200,120,.5),
      inset 0 0 0 1.5px rgba(255,220,140,.25);
    animation:sway var(--w,3.4s) ease-in-out var(--delay,0s) infinite alternate;
  }
  .lantern .body::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 1px),rgba(120,20,10,.35) calc(20% - 1px) 20%);
  }
  .lantern .body::after{
    content:"福";position:absolute;inset:0;display:grid;place-items:center;
    color:#ffe9a8;font-size:calc(var(--s,44px)*.42);font-weight:700;
    text-shadow:0 0 6px rgba(255,220,120,.8);
  }
  .lantern .cap,.lantern .base{margin:0 auto;width:calc(var(--s,44px)*.55);height:calc(var(--s,44px)*.13);background:linear-gradient(180deg,#a51e1e,#7c0f0f);border-radius:3px}
  .lantern .cap{box-shadow:0 -2px 6px rgba(0,0,0,.3)}
  .lantern .tassel{margin:2px auto 0;width:2px;height:calc(var(--s,44px)*.42);background:linear-gradient(#ffd45e,#e0442a);border-radius:2px;position:relative}
  .lantern .tassel::after{
    content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%) rotate(45deg);
    width:5px;height:5px;background:linear-gradient(135deg,#ffe08a,#d99a2b);border-radius:1px;
  }
  @keyframes floatup{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
  @keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

  /* ---------- 桂花花瓣与小花朵 ---------- */
  .petal{
    position:absolute;top:-4vh;width:10px;height:14px;
    background:radial-gradient(circle at 40% 30%,#fff3c8,#ffd873 70%,#f0b64e);
    border-radius:60% 60% 60% 60% / 70% 70% 40% 40%;
    opacity:0;pointer-events:none;
    animation:fall var(--t,9s) linear var(--delay,0s) infinite;
  }
  .blossom{position:absolute;top:-5vh;pointer-events:none;opacity:0;animation:fall var(--t,9s) linear var(--delay,0s) infinite}
  .blossom svg{display:block;filter:drop-shadow(0 0 3px rgba(255,220,120,.5))}
  @keyframes fall{
    0%{opacity:0;transform:translate(0,-4vh) rotate(0)}
    10%{opacity:.9}
    100%{opacity:0;transform:translate(var(--dx,6vw),108vh) rotate(340deg)}
  }

  /* ---------- 贺卡 ---------- */
  .card{
    position:fixed;left:50%;top:42.5%;transform:translate(-50%,-50%);
    width:min(86vw,460px);padding:clamp(24px,5.5vmin,42px) clamp(20px,5vmin,38px);
    text-align:center;color:var(--ink);z-index:6;
    background:
      repeating-linear-gradient(0deg,rgba(214,178,110,.05) 0 2px,transparent 2px 5px),
      linear-gradient(rgba(255,249,236,.85),rgba(255,249,236,.85)),

  }

  .corner{position:absolute;width:24px;height:24px;pointer-events:none;z-index:7}
  .corner::before{content:"";position:absolute;inset:0;border-top:2px solid var(--gold-deep);border-left:2px solid var(--gold-deep);border-radius:2px 0 0 0}
  .corner::after{content:"";position:absolute;width:5px;height:5px;background:linear-gradient(135deg,#e8c983,#b8862c);transform:rotate(45deg);left:-2.5px;top:-2.5px;box-shadow:0 0 5px rgba(230,198,132,.6)}
  .corner.tl{left:5px;top:5px}
  .corner.tr{right:5px;top:5px;transform:rotate(90deg)}
  .corner.br{right:5px;bottom:5px;transform:rotate(180deg)}
  .corner.bl{left:5px;bottom:5px;transform:rotate(270deg)}

  .card .eyebrow{
    font-size:clamp(11px,1.8vmin,13px);letter-spacing:.55em;text-indent:.55em;
    color:#a5763a;margin-bottom:10px;
    animation:riseIn .8s ease 1.25s both;
  }
  .card .eyebrow b{color:#c9a35c;font-weight:400;margin:0 .2em}
  .card h1{
    font-family:'Zhi Mang Xing','Ma Shan Zheng','STXingkai','Xingkai SC','KaiTi','STKaiti','楷体',serif;
    font-weight:400;font-size:clamp(50px,13vmin,78px);line-height:1.08;letter-spacing:.06em;
    background:linear-gradient(160deg,#8a5a14 0%,#c0973f 32%,#dbb96a 52%,#a8752a 78%,#8a5a14 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 10px rgba(170,130,55,.32));
    animation:riseIn .9s ease 1.4s both;
  }
  .card .verse{
    margin:10px 0 0;font-size:clamp(12px,2vmin,14px);color:#6f5330;letter-spacing:.22em;
    animation:riseIn .8s ease 1.55s both;
  }
  .divider{display:flex;align-items:center;gap:10px;margin:8px clamp(8px,3vmin,24px) 10px;animation:riseIn .8s ease 1.68s both}
  .divider::before,.divider::after{content:"";flex:1;height:1px}
  .divider::before{background:linear-gradient(90deg,transparent,var(--gold-deep))}
  .divider::after{background:linear-gradient(270deg,transparent,var(--gold-deep))}
  .divider i{
    width:7px;height:7px;transform:rotate(45deg);
    background:linear-gradient(135deg,#e8c983,#b8862c);
    box-shadow:0 0 6px rgba(230,198,132,.55);
  }

  .collage{display:flex;justify-content:center;margin:10px 0 4px;animation:riseIn .8s ease 1.8s both}
  .snap{
    position:relative;width:58%;background:#fffdf6;padding:5px 5px 3px;
    border:1px solid rgba(190,150,80,.45);border-radius:4px;
    box-shadow:0 4px 12px rgba(90,60,20,.22);
    animation:bob 3.8s ease-in-out infinite alternate;
    transition:box-shadow .3s;
    cursor:pointer;
  }
  .snap::after{
    content:"";position:absolute;inset:5px 5px 3px;pointer-events:none;border-radius:2px;
    box-shadow:inset 0 0 30px rgba(50,30,10,.30),inset 0 0 4px rgba(50,30,10,.16);
  }
  .snap img{display:block;width:100%;border-radius:2px;transition:transform .35s ease}
  .snap:hover,.snap:active{box-shadow:0 10px 26px rgba(70,45,15,.36)}
  .snap:hover img,.snap:active img{transform:translateY(-4px) scale(1.03)}
  @keyframes bob{from{transform:rotate(-2.5deg) translateY(0)}to{transform:rotate(-2.5deg) translateY(-4px)}}

  .card .greet{
    font-size:clamp(15px,2.5vmin,17px);line-height:2;color:#42301f;
    animation:riseIn .8s ease 1.95s both;
  }
  .card .from{
    margin-top:12px;padding-right:52px;text-align:right;font-size:clamp(12px,2vmin,13.5px);color:#8a6a3f;
    animation:riseIn .8s ease 2.1s both;
  }

  .card .school{margin-top:10px;animation:riseIn .8s ease 2.25s both}
  .card .school img{width:min(140px,46%);display:block;margin:0 auto;opacity:.55;filter:blur(.3px) saturate(.85)}

  .seal{
    position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:8px;
    background:radial-gradient(circle at 35% 30%,#d9534a,#c0392b 60%,#992d22);
    color:#fff4e0;display:grid;place-items:center;
    font-size:15px;line-height:1.15;letter-spacing:2px;text-indent:2px;
    box-shadow:0 2px 8px rgba(150,30,20,.45),inset 0 0 0 2px rgba(255,240,220,.3);
    writing-mode:vertical-rl;
    animation:sealIn .6s cubic-bezier(.2,1.4,.4,1) 2.4s both;
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes sealIn{from{opacity:0;transform:rotate(8deg) scale(.4)}to{opacity:1;transform:rotate(8deg) scale(1)}}

  /* ---------- 音乐开关 ---------- */
  #musicBtn{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    width:44px;height:44px;border-radius:50%;z-index:20;cursor:pointer;
    background:rgba(18,30,62,.55);border:1px solid rgba(232,201,131,.45);
    color:#e8d5a8;display:grid;place-items:center;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    transition:transform .2s,box-shadow .2s;
  }
  #musicBtn:active{transform:scale(.92)}
  #musicBtn.on{box-shadow:0 0 18px rgba(232,201,131,.5)}
  #musicBtn.on svg{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 底部按钮 ---------- */
  .actions{
    position:fixed;left:0;right:0;bottom:calc(2vh + env(safe-area-inset-bottom));
    display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;
    z-index:9;padding:0 16px;
  }
  #blessBtn{
    position:relative;overflow:hidden;
    font-family:inherit;font-size:clamp(15px,2.6vmin,17px);letter-spacing:.35em;text-indent:.35em;
    color:#3d1e0e;min-height:48px;padding:12px 32px;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(160deg,#eccc85,#d9ab48 55%,#bd8c2c);
    box-shadow:0 6px 20px rgba(200,160,80,.35),inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .2s,box-shadow .2s;
  }
  #blessBtn::after{
    content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);
    transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite;
  }
  @keyframes shine{0%,55%{transform:skewX(-20deg) translateX(0)}100%{transform:skewX(-20deg) translateX(360%)}}
  #blessBtn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(200,160,80,.5),inset 0 1px 0 rgba(255,255,255,.6)}
  #blessBtn:active{transform:scale(.96)}
  #blessBtn.done{letter-spacing:.2em;text-indent:.2em}

  #saveBtn{
    font-family:inherit;font-size:13px;letter-spacing:.12em;color:#ecd9a8;
    min-height:48px;padding:12px 18px;border-radius:999px;cursor:pointer;
    background:rgba(24,38,74,.5);border:1px solid rgba(232,201,131,.55);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    transition:transform .2s,box-shadow .2s;
  }
  #saveBtn:active{transform:scale(.94)}
  #saveBtn:hover{box-shadow:0 6px 18px rgba(232,201,131,.3)}

  #wish{
    position:absolute;top:calc(100% + 12px);left:50%;
    transform:translate(-50%,-8px) scale(.96);opacity:0;pointer-events:none;
    width:max-content;max-width:86vw;
    font-size:clamp(13px,2.2vmin,15px);letter-spacing:.08em;line-height:1.9;
    color:#f0dfae;text-shadow:0 2px 8px rgba(0,0,0,.5);
    transition:opacity .45s ease,transform .45s ease;
  }
  #wish.open{opacity:1;transform:translate(-50%,0) scale(1)}

  /* 金色星光粒子 */
  .spark{
    position:fixed;border-radius:50%;pointer-events:none;z-index:50;
    background:radial-gradient(circle,#ffe9a8,#e0ae42);
    box-shadow:0 0 8px rgba(240,200,110,.85);
    animation:sparkFly .9s cubic-bezier(.15,.6,.35,1) forwards;
  }
  @keyframes sparkFly{
    from{opacity:1;transform:translate(-50%,-50%) scale(1)}
    to{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.15)}
  }

  /* ---------- 导出弹层 ---------- */
  #exportMask{
    position:fixed;inset:0;z-index:99;display:none;
    background:rgba(4,8,20,.9);
    -webkit-touch-callout:default;
  }
  #exportMask.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #exportMask img{max-width:82vw;max-height:68vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #exportMask .tip{margin-top:14px;color:#e8d9b0;font-size:14px;letter-spacing:.1em}
  #closeExport{
    position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;
    width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,201,131,.5);
    background:rgba(24,38,74,.6);color:#e8d5a8;font-size:17px;cursor:pointer;
  }
  #toast{
    position:fixed;left:50%;bottom:16vh;transform:translateX(-50%) translateY(8px);
    background:rgba(18,30,62,.9);color:#f0dfae;font-size:13px;letter-spacing:.08em;
    padding:10px 20px;border-radius:999px;border:1px solid rgba(232,201,131,.4);
    opacity:0;pointer-events:none;z-index:100;transition:opacity .3s,transform .3s;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-height:600px){
    .card{zoom:.8}
  }

  /* ---- 导出快照时：动画归位、特效回退为 html2canvas 可渲染形式 ---- */
  body.exporting .card,
  body.exporting .card *{
    animation:none !important;
    opacity:1 !important;
  }
  body.exporting .card{zoom:1}
  body.exporting .card::after{display:none}
  body.exporting .seal{transform:rotate(8deg)}
  body.exporting .card h1{
    background:none !important;
    -webkit-background-clip:border-box !important;
    background-clip:border-box !important;
    -webkit-text-fill-color:#8a5a14 !important;
    color:#8a5a14 !important;
    filter:none !important;
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01s !important;animation-iteration-count:1 !important}
  }
</style>
</head>

<div class="actions">
  <button id="blessBtn">点 亮 祝 福</button>
  <button id="saveBtn">保存贺卡图片</button>
  <div id="wish">愿这轮明月，照亮你想去的远方；愿今夜之后，诸事顺遂，人月两圆。</div>
</div>

<div id="exportMask">
  <button id="closeExport">✕</button>
  <img id="exportImg" alt="中秋贺卡">
  <div class="tip">长按图片保存到手机相册</div>
</div>
<div id="toast"></div>

<script>
(function(){
  'use strict';
  var isWeChat=/MicroMessenger/i.test(navigator.userAgent);
  function toast(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2200);
  }

  /* ---- 时间感知：中秋当日增强特效 ---- */
  var FEST=[[2025,10,6],[2026,9,25],[2027,9,15],[2028,10,3],[2029,9,22]];
  var now=new Date(),fest=false;
  FEST.forEach(function(d){
    if(now.getFullYear()===d[0]&&now.getMonth()+1===d[1]&&now.getDate()===d[2])fest=true;
  });
  if(fest)document.body.classList.add('fest');

  /* ---- Canvas 分层星空 + 流星 ---- */
  var cv=document.getElementById('stars'),cx=cv.getContext('2d');
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var mobile=window.matchMedia('(max-width:600px)').matches;
  var COUNT=mobile?40:80;
  var stars=[],meteors=[],meteorAt=1.5;
  function size(){
    cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
    cx.setTransform(dpr,0,0,dpr,0,0);
    stars=[];
    for(var i=0;i<COUNT;i++){
      var far=i<COUNT*0.62;
      stars.push({
        x:Math.random()*innerWidth,y:Math.random()*innerHeight*0.72,
        r:far?0.4+Math.random()*0.7:0.9+Math.random()*1.1,
        far:far,ph:Math.random()*6.283,
        sp:far?0.4+Math.random()*0.5:0.9+Math.random()*1.3,
        gold:Math.random()<0.18
      });
    }
  }
  function drawStars(t){
    var boost=fest?1.35:1;
    for(var i=0;i<stars.length;i++){
      var s=stars[i];
      var wave=0.5+0.5*Math.sin(s.ph+t*s.sp);
      var a=(s.far?0.10+0.18*wave:0.34+0.5*wave)*boost;
      cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);
      cx.fillStyle=s.gold?'rgba(255,228,160,'+a+')':'rgba(235,240,255,'+a+')';
      cx.fill();
      if(!s.far){
        cx.beginPath();cx.arc(s.x,s.y,s.r*2.6,0,6.283);
        cx.fillStyle='rgba(200,215,255,'+(a*0.15)+')';cx.fill();
      }
    }
  }
  function drawMeteors(t,dt){
    if(t>meteorAt){
      meteors.push({
        x:innerWidth*(0.2+Math.random()*0.65),y:innerHeight*(0.02+Math.random()*0.2),
        vx:-(160+Math.random()*130),vy:110+Math.random()*90,life:0
      });
      meteorAt=t+(fest?2.5+Math.random()*3:4.5+Math.random()*4.5);
    }
    for(var m=meteors.length-1;m>=0;m--){
      var mt=meteors[m];
      mt.x+=mt.vx*dt;mt.y+=mt.vy*dt;mt.life+=dt;
      var o=Math.max(0,1-mt.life/1.3);
      if(o<=0){meteors.splice(m,1);continue}
      var tx=mt.x-mt.vx*0.55,ty=mt.y-mt.vy*0.55;
      var g=cx.createLinearGradient(mt.x,mt.y,tx,ty);
      g.addColorStop(0,'rgba(255,255,255,'+(0.9*o)+')');
      g.addColorStop(1,'rgba(255,255,255,0)');
      cx.strokeStyle=g;cx.lineWidth=1.6;
      cx.beginPath();cx.moveTo(mt.x,mt.y);cx.lineTo(tx,ty);cx.stroke();
    }
  }
  var prev=0;
  function tick(ts){
    requestAnimationFrame(tick);
    if(document.hidden)return;
    var t=ts/1000,dt=Math.min(0.05,t-prev||0.016);prev=t;
    cx.clearRect(0,0,innerWidth,innerHeight);
    drawStars(t);drawMeteors(t,dt);
  }
  size();addEventListener('resize',size);
  requestAnimationFrame(tick);

  /* ---- 云 / 灯笼 / 桂花 ---- */
  var sky=document.getElementById('sky');
  var speeds=[90,130,170];
  for(var c=0;c<3;c++){
    var cl=document.createElement('div');
    cl.className='cloud';
    var w=140+Math.random()*160;
    cl.style.cssText='width:'+w+'px;top:'+(8+c*17+Math.random()*6)+'vh;animation-duration:'+speeds[c]+'s;animation-delay:-'+(Math.random()*speeds[c])+'s;';
    sky.appendChild(cl);
  }
  function spawnLantern(x,size,dur,delay){
    var l=document.createElement('div');
    l.className='lantern';
    l.style.cssText='left:'+x+'vw;--s:'+size+'px;--t:'+dur+'s;--delay:'+delay+'s;--w:'+(2.6+Math.random()*1.8)+'s;';
    l.innerHTML='<div class="cap"></div><div class="body"></div><div class="base"></div><div class="tassel"></div>';
    sky.appendChild(l);
    l.addEventListener('animationend',function(){l.remove()});
  }
  var n=0;
  (function autoLantern(){
    spawnLantern(4+Math.random()*88,34+Math.random()*22,20+Math.random()*10,0);
    if(++n<7)setTimeout(autoLantern,2600);
  })();
  for(var p=0;p<14;p++){
    var pe=document.createElement('div');
    pe.className='petal';
    pe.style.cssText='left:'+(Math.random()*100)+'vw;--t:'+(7+Math.random()*6)+'s;--delay:'+(Math.random()*9)+'s;--dx:'+((Math.random()*14)-7)+'vw;transform:scale('+(0.6+Math.random()*0.8)+')';
    sky.appendChild(pe);
  }
  var FLOWER='<svg viewBox="0 0 20 20" width="13" height="13"><g fill="#ffe9a8"><circle cx="10" cy="5" r="3.2"/><circle cx="15" cy="10" r="3.2"/><circle cx="10" cy="15" r="3.2"/><circle cx="5" cy="10" r="3.2"/><circle cx="10" cy="10" r="2.4" fill="#f0b64e"/></g></svg>';
  for(var f=0;f<10;f++){
    var bl=document.createElement('div');
    bl.className='blossom';
    bl.innerHTML=FLOWER;
    bl.style.cssText='left:'+(Math.random()*100)+'vw;--t:'+(8+Math.random()*7)+'s;--delay:'+(Math.random()*10)+'s;--dx:'+((Math.random()*16)-8)+'vw;transform:scale('+(0.7+Math.random()*0.7)+')';
    sky.appendChild(bl);
  }
  sky.addEventListener('click',function(e){
    if(e.target.closest('.card,.actions'))return;
    spawnLantern(e.clientX/innerWidth*100,34+Math.random()*18,16+Math.random()*8,0);
  });

  /* ---- 点亮祝福：星光散开 + 短句展开 ---- */
  var btn=document.getElementById('blessBtn'),wish=document.getElementById('wish'),lit=false;
  function burst(el){
    var r=el.getBoundingClientRect(),x0=r.left+r.width/2,y0=r.top+r.height/2;
    for(var i=0;i<26;i++){
      var s=document.createElement('span');
      s.className='spark';
      var ang=Math.random()*6.283,d=60+Math.random()*95,sz=3+Math.random()*4;
      s.style.cssText='left:'+x0+'px;top:'+y0+'px;width:'+sz+'px;height:'+sz+'px;--tx:'+(Math.cos(ang)*d)+'px;--ty:'+(Math.sin(ang)*d)+'px;animation-delay:'+(Math.random()*0.08)+'s;';
      document.body.appendChild(s);
      s.addEventListener('animationend',function(){this.remove()});
    }
  }
  btn.addEventListener('click',function(){
    burst(btn);
    wish.classList.toggle('open');
    if(!lit){lit=true;btn.textContent='花 好 月 圆';btn.classList.add('done');}
  });

  /* ---- 背景音乐：One Night in Shanghai ·「月落乌啼霜满天」副歌片段 ---- */
  var musicBtn=document.getElementById('musicBtn');
  var bgm=document.getElementById('bgm');
  bgm.volume=.85;
  function syncMusic(){
    var on=!bgm.paused && !bgm.ended;
    musicBtn.classList.toggle('on',on);
    musicBtn.setAttribute('aria-label',on?'暂停背景音乐':'播放背景音乐');
  }
  musicBtn.addEventListener('click',function(){
    if(bgm.paused){var pr=bgm.play();if(pr&&pr.catch)pr.catch(function(){});}
    else bgm.pause();
  });
  bgm.addEventListener('play',syncMusic);
  bgm.addEventListener('pause',syncMusic);

  /* ---- 保存贺卡图片（html2canvas，多级 CDN 按需加载） ---- */
  var saveBtn=document.getElementById('saveBtn'),exporting=false;
  var CDNS=[
    'https://cdn.staticfile.org/html2canvas/1.4.1/html2canvas.min.js',
    'https://lib.baomitu.com/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
    'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js'
  ];
  function loadH2C(){
    if(window.html2canvas)return Promise.resolve();
    return new Promise(function(resolve,reject){
      var i=0;
      (function next(){
        var s=document.createElement('script'),done=false,timer;
        timer=setTimeout(function(){
          if(done)return;done=true;s.remove();
          if(++i<CDNS.length)next();else reject(new Error('cdn timeout'));
        },8000);
        s.onload=function(){
          if(done)return;done=true;clearTimeout(timer);
          if(window.html2canvas)resolve();
          else if(++i<CDNS.length)next();else reject(new Error('lib invalid'));
        };
        s.onerror=function(){
          if(done)return;done=true;clearTimeout(timer);s.remove();
          if(++i<CDNS.length)next();else reject(new Error('net error'));
        };
        s.src=CDNS[i];document.head.appendChild(s);
      })();
    });
  }
  function nextFrame(){
    return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});
  }
  saveBtn.addEventListener('click',function(){
    if(exporting)return;
    exporting=true;
    var old=saveBtn.textContent;
    saveBtn.textContent='生成中…';
    loadH2C().then(function(){
      if(document.fonts&&document.fonts.load){
        return Promise.all([
          document.fonts.load('70px "Zhi Mang Xing"','中秋快乐').catch(function(){}),
          document.fonts.load('17px "Noto Serif SC"','亲爱的朋友嘿嘿还挺好玩').catch(function(){})
        ]);
      }
    }).then(function(){
      return document.fonts.ready;
    }).then(function(){
      document.body.classList.add('exporting');
      return nextFrame();
    }).then(function(){
      return html2canvas(document.getElementById('cardEl'),{
        backgroundColor:null,
        scale:Math.min(2,window.devicePixelRatio||1.5),
        useCORS:true,logging:false
      });
    }).then(function(out){
      document.body.classList.remove('exporting');
      var url=out.toDataURL('image/png');
      var img=document.getElementById('exportImg'),mask=document.getElementById('exportMask');
      img.src=url;
      mask.classList.add('show');
      if(!isWeChat){
        try{
          var a=document.createElement('a');
          a.href=url;a.download='中秋贺卡.png';
          document.body.appendChild(a);a.click();a.remove();
        }catch(e){}
      }
    }).catch(function(){
      document.body.classList.remove('exporting');
      toast('导出失败，请检查网络后重试');
    }).finally(function(){
      exporting=false;saveBtn.textContent=old;
    });
  });
  document.getElementById('closeExport').addEventListener('click',function(){
    document.getElementById('exportMask').classList.remove('show');
  });
})();
</script>
</body>
</html>
